name: backup.nightly

# D17 (docs/decisions.md, "the build file calls this D17"): a Vercel
# serverless function cannot run pg_dump — no binary in that runtime, and
# its timeout is far shorter than a growing logical dump. ubuntu-latest has
# a real pg_dump.
#
# 19:30 UTC = 01:00 IST (01-hld.md §10.2's own schedule). GitHub Actions
# cron is UTC, same as Vercel's — AGENTS.md background job rule 4 applies
# here just as much as it does to vercel.json.
#
# This workflow WRITES the backup and reports its own outcome. A second,
# independent check (/api/cron/backup.verify, a real Vercel cron at 02:30
# IST) reads the bucket half an hour later and fails if the object is
# missing — D17's own requirement that the alert asserts a real object
# exists, not merely that this job didn't throw. Either can fail without
# silencing the other.

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch: {} # for a manual re-run after a failure (see the backup-failed.md runbook)

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `awscli` (the apt package) no longer has an installation candidate on
      # ubuntu-latest's current noble image — Ubuntu dropped it from the repos
      # this workflow was failing at this very step, before ever touching a
      # credential, so it was failing identically whether or not the R2
      # secrets below are real yet. AWS's own official v2 installer doesn't
      # depend on the distro's package set.
      - name: Install PostgreSQL client and AWS CLI
        run: |
          # pg_dump refuses to dump a server newer than itself. Ubuntu's
          # `postgresql-client` is pinned to 16 and the runner image ships a
          # PGDG 16 client, but the database is PostgreSQL 17 — so add the
          # PGDG repo and install the 17 client explicitly.
          sudo apt-get update && sudo apt-get install -y postgresql-common unzip
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          curl -sf "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          rm -rf awscliv2.zip aws

      # Proves which pg_dump the dump will run, and fails before touching the
      # database if it is not 17. Full path, never bare `pg_dump`:
      # /usr/bin/pg_dump is Debian's version wrapper and can still select the
      # preinstalled 16 client.
      - name: Verify pg_dump version
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -qE ' 17\.' \
            || { echo "::error::expected pg_dump 17"; exit 1; }

      - name: Dump and compress
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          KEY="pg_dump/$(date -u +%F).sql.gz"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges | gzip > backup.sql.gz

      # A token scoped ONLY to apex-backups (build §0.1) — distinct from the
      # app's own R2 credentials, which must never be able to reach this
      # bucket at all. It must be an Object Read & WRITE token: the Object
      # Read-only token (the one Vercel's backup.verify uses) authenticates
      # fine and then fails here with AccessDenied on PutObject.
      - name: Upload to R2
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2 now sends extra default checksums that R2 does not
          # fully support; Cloudflare's aws-cli guide says to only send them
          # when the operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          KEY: ${{ steps.dump.outputs.key }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?the R2_BACKUP_ACCESS_KEY_ID repository secret is not set}"
          : "${AWS_SECRET_ACCESS_KEY:?the R2_BACKUP_SECRET_ACCESS_KEY repository secret is not set}"
          : "${R2_BACKUP_BUCKET:?the R2_BACKUP_BUCKET repository secret is not set}"
          : "${R2_ACCOUNT_ID:?the R2_ACCOUNT_ID repository secret is not set}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp backup.sql.gz "s3://${R2_BACKUP_BUCKET}/${KEY}" --endpoint-url "$ENDPOINT" \
            || { echo "::error::R2 upload failed. AccessDenied means the token is read-only or not scoped to this bucket; it needs Object Read & Write on apex-backups."; exit 1; }
          # Prove the object is really there, not just that cp exited 0.
          aws s3api head-object --bucket "$R2_BACKUP_BUCKET" --key "$KEY" --endpoint-url "$ENDPOINT"

      # --fail-with-body alone is not enough: a 3xx is not an HTTP error to
      # curl, so a redirect (e.g. middleware bouncing to /login) used to pass
      # silently. Require exactly 200.
      - name: Report success
        if: success()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEY: ${{ steps.dump.outputs.key }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 -X POST "$APP_URL/api/backup/report" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"ok\": true, \"key\": \"$KEY\"}")
          cat body.txt; echo
          [ "$CODE" = "200" ] || { echo "::error::/api/backup/report returned HTTP $CODE"; exit 1; }

      # Only when the backup itself did not land — a failed success-report
      # must not record a successful upload as a failed backup.
      - name: Report failure
        if: failure() && steps.upload.outcome != 'success'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 -X POST "$APP_URL/api/backup/report" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"ok": false, "error": "backup-nightly workflow failed — see the Actions run log"}')
          cat body.txt; echo
          [ "$CODE" = "200" ] || { echo "::error::/api/backup/report returned HTTP $CODE"; exit 1; }
