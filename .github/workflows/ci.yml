name: CI

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ CI IS BACK ON — 2026-11-23, APX-13 (docs/decisions.md D49 and D14, both   │
# │ amended). It runs on every pull request, on every push to `main`, and by  │
# │ hand on any branch (`gh workflow run ci.yml --ref <branch>`).             │
# │                                                                          │
# │ It was paused on 2026-09-17 because the `database` job pushed migrations, │
# │ ran the seed and the integration suite against `secrets.SUPABASE_DB_URL`  │
# │ — the one Supabase project, which is production. That job now never      │
# │ leaves the runner: it starts a THROWAWAY local Supabase stack on the      │
# │ GitHub runner's own Docker (`supabase start`), which applies every        │
# │ migration and supabase/seed.sql to an empty database, runs the suites     │
# │ against 127.0.0.1, and is destroyed with the runner. It reads no secret,  │
# │ needs no second project and holds no production credential.             │
# │                                                                          │
# │ Docker is still not part of the DEVELOPER toolchain (D14); it is used     │
# │ only inside the GitHub-hosted runner. The production-ref guard in         │
# │ `scripts/lib/db-target.mjs` still refuses the live project; it lets an    │
# │ unset SUPABASE_PROD_PROJECT_REF pass only when every target is loopback.  │
# │                                                                          │
# │ `backup-nightly.yml`, `jobs-drain.yml` and `jobs-reap.yml` are production │
# │ operations, not CI, and are unaffected.                                  │
# └──────────────────────────────────────────────────────────────────────────┘
#
# docs/architecture.md §10.1. The full pipeline is:
#
#   install → typecheck → lint → secret scan → unit tests → build
#   → db (throwaway local Supabase on the runner: migrations, seed)
#   → RLS tests (pgTAP, against that stack)   ◄── BLOCKING BY POLICY
#   → integration tests → drift → deploy preview → e2e → production
#
# The e2e stage is added in Build 10, when it has content.
#
# Node 22, every job (package.json's engines already allows >=20): the
# Build 04 integration suite instantiates a real supabase-js client, whose
# realtime module reaches for a native WebSocket global that Node only ships
# by default from 22 onward — found live when this CI job, still pinned to
# 20, failed with "Node.js detected but native WebSocket not found" on a
# suite that ran fine locally (Node 24).
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THE RLS STAGE IS BLOCKING BY POLICY.                                     │
# │                                                                          │
# │ It must never be given `continue-on-error`, never be marked optional,    │
# │ and never be skipped to get a release out. It is the test suite that     │
# │ protects the product's core promise: a client cannot read internal cost  │
# │ or margin. If it is red, the change does not ship.                       │
# │ docs/architecture.md §10.1, docs/ai-workflow-rules.md §8.                │
# └──────────────────────────────────────────────────────────────────────────┘

on:
  pull_request:
  push:
    branches: [main]
  # Any branch, by hand: `gh workflow run ci.yml --ref <branch>` is how a
  # migration is tested before it reaches production.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan the commits in the PR, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        # No secrets in CI, and none are needed to compile. lib/env.ts still
        # validates at runtime; this only skips the build-time parse.
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm build

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the commits on the pull request to scan only what
    # changed, so it needs read access to pull requests. The top-level
    # `contents: read` alone gives a 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs/architecture.md §6.5: high and critical are a build failure.
      - run: pnpm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────────
  # DATABASE, RLS AND INTEGRATION
  #
  # Against a throwaway local Supabase stack on this runner (APX-13; D49 and
  # D14 amended 2026-11-23). Nothing here can reach production: no secret is
  # read, every URL is 127.0.0.1, and the stack dies with the runner.
  #
  # `supabase start` on an empty volume IS the reset: it creates the database,
  # applies every file in supabase/migrations in order, then supabase/seed.sql
  # ([db.seed] in supabase/config.toml), and registers the custom access token
  # hook ([auth.hook.custom_access_token]). A migration that fails to apply
  # fails that step. No separate `supabase db reset` is run — it would only
  # repeat the same work and restart the containers.
  #
  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ THE RLS STAGE IS BLOCKING BY POLICY (architecture.md §10.1).             │
  # │                                                                          │
  # │ It must never be given `continue-on-error`, never be marked optional and  │
  # │ never be skipped to get a release out. It is the suite that protects the  │
  # │ product's core promise: a client cannot read internal cost or margin.     │
  # └──────────────────────────────────────────────────────────────────────────┘
  database:
    name: migrations · seed · RLS · drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Raise local auth rate limits (runner copy of config.toml only)
        # The integration suite signs in far more than 30 times inside five
        # minutes, all from one IP, which trips GoTrue's sign-in limit. This
        # edits the runner's checkout only; the committed config.toml (which
        # `supabase config push` sends to production) keeps its limits.
        run: |
          sed -i -E \
            -e 's/^sign_in_sign_ups = [0-9]+/sign_in_sign_ups = 10000/' \
            -e 's/^token_refresh = [0-9]+/token_refresh = 10000/' \
            -e 's/^token_verifications = [0-9]+/token_verifications = 10000/' \
            supabase/config.toml
          grep -nE '^(sign_in_sign_ups|token_refresh|token_verifications) =' supabase/config.toml

      - name: Leave the custom access token hook unregistered, as in production
        # Production has never registered public.custom_access_token_hook with
        # GoTrue (docs/progress-tracker.md; it needs `supabase config push`),
        # so auth_role()/auth_org() read profiles on each request. config.toml
        # enables it, and on a local stack that registration takes effect —
        # where the hook returns NULL (profiles forces RLS and has no policy
        # for supabase_auth_admin) and every sign-in fails with "output claims
        # do not conform to the expected schema". CI tests what production
        # runs; the hook's own defect is a known issue, not a CI concern.
        run: |
          sed -i -E '/^\[auth\.hook\.custom_access_token\]/,/^enabled/ s/^enabled = true/enabled = false/' \
            supabase/config.toml
          grep -nA1 '^\[auth\.hook\.custom_access_token\]' supabase/config.toml

      - name: Start a throwaway Supabase (applies migrations + seed)
        # Only Postgres, GoTrue (auth), PostgREST and Kong (the API gateway)
        # are needed: the suites talk SQL to :54322 and supabase-js to :54321.
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Point the suites at the local stack
        # The CLI's local demo keys — identical on every machine, not secrets.
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          case "$DB_URL" in *@127.0.0.1:*|*@localhost:*) ;; *) echo "::error::DB_URL is not local"; exit 1;; esac
          case "$API_URL" in http://127.0.0.1:*|http://localhost:*) ;; *) echo "::error::API_URL is not local"; exit 1;; esac
          {
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          echo "DB  $DB_URL"
          echo "API $API_URL"

      - name: RLS and structural tests (pgTAP)
        run: pnpm test:rls

      - name: Integration tests
        # Signs in as each seeded role through a real supabase-js client
        # (AGENTS.md database rule 8), against the local GoTrue + PostgREST.
        run: pnpm test:integration

      - name: Drizzle drift check
        run: pnpm db:check-drift

      - name: Supabase container logs (on failure)
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep supabase_); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1 || true; echo "::endgroup::"
          done

  # Reports inputs that are still on hold — missing facts, not broken code.
  #
  # `continue-on-error` is deliberate HERE and nowhere else. These items block
  # issuing a real document, not writing code, and a permanently red required
  # check is one people learn to ignore, which is how the RLS stage would end up
  # ignored too. The production deploy workflow (Build 10) runs the same script
  # as a hard gate.
  release-readiness:
    name: inputs on hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
