<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Apex Projects</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --background:0 0% 100%; --foreground:0 0% 9%;
  --card:0 0% 100%; --muted:0 0% 96%; --muted-foreground:0 0% 45%;
  --border:0 0% 90%; --border-strong:0 0% 78%; --input:0 0% 87%; --ring:0 0% 9%;
  --primary:0 0% 9%; --primary-foreground:0 0% 100%;
  --secondary:0 0% 95%; --secondary-foreground:0 0% 9%;
  --accent:0 0% 95%; --destructive:0 0% 9%; --destructive-foreground:0 0% 100%;
  --sidebar:0 0% 99%; --sidebar-border:0 0% 90%;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:0 0% 7%; --foreground:0 0% 96%; --card:0 0% 9.5%;
    --muted:0 0% 15%; --muted-foreground:0 0% 63%; --border:0 0% 18%; --border-strong:0 0% 28%; --input:0 0% 22%; --ring:0 0% 90%;
    --primary:0 0% 96%; --primary-foreground:0 0% 9%; --secondary:0 0% 16%; --secondary-foreground:0 0% 96%; --accent:0 0% 16%;
    --destructive:0 0% 96%; --destructive-foreground:0 0% 9%; --sidebar:0 0% 6%; --sidebar-border:0 0% 17%;
  }
}
:root[data-theme="dark"]{
  --background:0 0% 7%; --foreground:0 0% 96%; --card:0 0% 9.5%;
  --muted:0 0% 15%; --muted-foreground:0 0% 63%; --border:0 0% 18%; --border-strong:0 0% 28%; --input:0 0% 22%; --ring:0 0% 90%;
  --primary:0 0% 96%; --primary-foreground:0 0% 9%; --secondary:0 0% 16%; --secondary-foreground:0 0% 96%; --accent:0 0% 16%;
  --destructive:0 0% 96%; --destructive-foreground:0 0% 9%; --sidebar:0 0% 6%; --sidebar-border:0 0% 17%;
}
*{box-sizing:border-box;border-color:hsl(var(--border))}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em}
h1{font-size:26px;line-height:1.2}h2{font-size:17px}h3{font-size:14px;font-weight:600}
a{color:inherit}
.muted{color:hsl(var(--muted-foreground))}
.text-sm{font-size:13px}.text-xs{font-size:12px}
/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:hsl(var(--sidebar));border-right:1px solid hsl(var(--sidebar-border));display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px}
.brand .logo{width:30px;height:30px;border-radius:7px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center;font-weight:700;font-size:13px}
.brand .t{font-weight:700;font-size:14px;line-height:1.2}
.brand .s{font-size:11.5px;color:hsl(var(--muted-foreground))}
.navtop{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid hsl(var(--border));background:none;border-radius:0;padding:9px 8px 13px;margin-bottom:10px;cursor:pointer;font-weight:600;font-size:13.5px;color:hsl(var(--foreground))}
.navtop:hover{opacity:.7}
.navtop.on{color:hsl(var(--foreground))}
.navtop svg{width:16px;height:16px;flex:none;color:hsl(var(--foreground))}
.projhead{font-size:13px;font-weight:700;padding:8px 8px 6px;color:hsl(var(--foreground));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{font-size:11px;font-weight:600;color:hsl(var(--muted-foreground));padding:14px 8px 6px;text-transform:uppercase;letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 8px;cursor:pointer;font-weight:500;font-size:13.5px;color:hsl(var(--foreground))}
.nav button:hover{background:hsl(var(--accent))}
.nav button.on{background:hsl(var(--accent));font-weight:600}
.nav button svg{width:16px;height:16px;flex:none;color:hsl(var(--muted-foreground))}
.nav button.on svg{color:hsl(var(--foreground))}
.nav button.sub{padding-left:34px;font-weight:400;color:hsl(var(--muted-foreground))}
.mno{display:inline-block;min-width:22px;margin-right:6px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums;font-weight:500}
.nav .chev{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:4px;color:hsl(var(--muted-foreground))}
.nav .chev:hover{background:hsl(var(--border))}
.nav .chev svg{width:14px;height:14px;transition:transform .15s}
.nav .chev.open svg{transform:rotate(90deg)}
.nav button.sub.on{color:hsl(var(--foreground));font-weight:500}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-radius:999px;min-width:18px;height:18px;padding:0 6px;display:grid;place-items:center}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid hsl(var(--border))}
.avatar{width:30px;height:30px;border-radius:50%;background:hsl(var(--muted));display:grid;place-items:center;font-size:11.5px;font-weight:600}
.user .t{font-weight:600;font-size:13px;line-height:1.2}.user .s{font-size:11.5px;color:hsl(var(--muted-foreground))}
.main{min-width:0}
.header{height:56px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid hsl(var(--border));position:sticky;top:0;background:hsl(var(--background));z-index:5}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:hsl(var(--muted-foreground));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{font-weight:600;color:hsl(var(--foreground))}
.header .sp{flex:1}
.content{padding:28px;max-width:1280px}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:hsl(var(--muted-foreground));font-size:13.5px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px}
/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid hsl(var(--input));background:hsl(var(--background));font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:hsl(var(--accent))}
.btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:hsl(var(--primary))}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:hsl(var(--accent))}
.btn.destructive{color:hsl(var(--foreground));border-color:hsl(var(--input))}
.btn.destructive:hover{background:hsl(var(--foreground));color:hsl(var(--background));border-color:hsl(var(--foreground))}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn svg{width:15px;height:15px}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
/* card */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius)}
.card .ch{padding:15px 20px;border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;gap:12px}
.card .ch .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
/* statbar - unified stat row (replaces separate boxes for less clutter) */
.statbar{display:flex;flex-wrap:wrap;margin-bottom:20px}
.statbar .stat{flex:1 1 170px;padding:18px 22px;border-right:1px solid hsl(var(--border));border-bottom:1px solid hsl(var(--border))}
.statbar .stat:last-child{border-right:0}
.stat .l{font-size:11.5px;font-weight:600;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1.2}
.stat .s{font-size:12px;color:hsl(var(--muted-foreground));margin-top:4px}
.stat .v.neg{font-weight:700}
.flagmini{font-size:9.5px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:5px;text-transform:uppercase;letter-spacing:.04em;vertical-align:2px}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-foreground));padding:10px 16px;border-bottom:1px solid hsl(var(--border));white-space:nowrap;height:40px}
td{padding:12px 16px;border-bottom:1px solid hsl(var(--border));vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:hsl(var(--muted)/.6)}
th.num,td.num{text-align:right}
td .sub{display:block;font-size:12px;color:hsl(var(--muted-foreground));font-weight:400;margin-top:1px}
td.name{font-weight:500}
tr.total td{font-weight:700;background:hsl(var(--muted)/.5)}
/* progress */
.progress{height:7px;border-radius:999px;background:hsl(var(--muted));overflow:hidden;min-width:110px}
.progress i{display:block;height:100%;background:hsl(var(--primary));border-radius:999px}
.progress i.over{background:repeating-linear-gradient(135deg,hsl(var(--foreground)) 0 5px,hsl(var(--muted-foreground)) 5px 10px)}
.pcell{display:flex;align-items:center;gap:10px}
.pcell span{font-size:12px;color:hsl(var(--muted-foreground));min-width:34px;text-align:right}
/* badge */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge.default{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.badge.secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.badge.outline{border-color:hsl(var(--border-strong));color:hsl(var(--foreground))}
/* tabs */
.tabs{display:inline-flex;background:hsl(var(--muted));border-radius:8px;padding:4px;gap:2px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:5px;font-weight:500;font-size:13.5px;cursor:pointer;color:hsl(var(--muted-foreground))}
.tabs button.on{background:hsl(var(--background));color:hsl(var(--foreground));font-weight:600}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid hsl(var(--input));background:hsl(var(--background));border-radius:7px;padding:0 10px;font-size:13.5px}
.field textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.field .hint{font-size:12px;color:hsl(var(--muted-foreground));margin-top:5px}
.field input[type=range]{padding:0;border:0;height:auto}
.row2{display:flex;gap:8px}.row2 > *{flex:1}
/* dialog */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.dialog{background:hsl(var(--background));border:1px solid hsl(var(--border));border-radius:12px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.dialog .dh{padding:22px 24px 4px}
.dialog .dh h2{font-size:17px}
.dialog .dh p{margin:4px 0 0;font-size:13.5px;color:hsl(var(--muted-foreground))}
.dialog .db{padding:16px 24px}
.dialog .df{padding:4px 24px 22px;display:flex;justify-content:flex-end;gap:8px}
/* gantt */
.gantt{overflow-x:auto}
.g{display:grid;min-width:960px}
.g .h{font-size:12px;color:hsl(var(--muted-foreground));padding:8px 6px;border-bottom:1px solid hsl(var(--border));text-align:center;white-space:nowrap;font-weight:500}
.g .h.th{text-align:left;padding-left:16px;position:sticky;left:0;background:hsl(var(--card));z-index:2}
.g .h.now{color:hsl(var(--foreground))}
.g .h .wd{display:block;font-size:14px;font-weight:700;color:hsl(var(--foreground));line-height:1.2}
.g .h .wn{display:block;font-size:11px;color:hsl(var(--muted-foreground))}
.g .mh{font-size:12px;font-weight:600;padding:8px 10px;border-bottom:1px solid hsl(var(--border));border-left:1px solid hsl(var(--border));background:hsl(var(--muted)/.5);white-space:nowrap}
.g .mh.first{border-left:0;position:sticky;left:0;z-index:2}
.g .task{padding:10px 16px;border-bottom:1px solid hsl(var(--border));position:sticky;left:0;background:hsl(var(--card));z-index:1;font-size:13px}
.g .task .t{font-weight:500}.g .task .m{font-size:12px;color:hsl(var(--muted-foreground))}
.g .cell{border-bottom:1px solid hsl(var(--border));border-left:1px solid hsl(var(--border)/.6);position:relative;min-height:46px}
.g .cell.now{background:hsl(var(--muted)/.6)}
.g .grp{background:hsl(var(--muted)/.5);font-size:12px;font-weight:600;color:hsl(var(--foreground));padding:6px 16px 6px 10px;position:sticky;left:0;z-index:1;border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;gap:6px;white-space:nowrap;text-transform:none;letter-spacing:normal}
.gclick,.sclick{cursor:pointer;user-select:none}
.sclick:hover,.gclick:hover{background:hsl(var(--muted)/.8)}
.gchev{display:inline-grid;place-items:center;width:18px;height:18px;color:hsl(var(--muted-foreground))}
.gchev svg{width:14px;height:14px;transition:transform .15s}
.gchev.open svg{transform:rotate(90deg)}
.g .gcell{background:hsl(var(--muted)/.5);border-bottom:1px solid hsl(var(--border));min-height:28px}
.bar{position:absolute;top:13px;height:20px;border-radius:5px;background:hsl(var(--primary)/.12);overflow:hidden;cursor:pointer}
.bar:hover{outline:2px solid hsl(var(--ring)/.4)}
.bar .p{position:absolute;left:0;top:0;bottom:0;background:hsl(var(--primary))}
.bar.late{outline:1.5px dashed hsl(var(--foreground));outline-offset:1px}
/* updates */
.ulist{display:flex;flex-direction:column;padding:4px 20px 8px}
.upd{position:relative;padding:4px 0 22px 26px;border-left:2px solid hsl(var(--border));margin-left:6px}
.upd:last-child{padding-bottom:6px}
.upd::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:hsl(var(--primary));border:2px solid hsl(var(--card))}
.uh{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.ud{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.ut{font-size:13.5px;max-width:70ch}
.uph{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.uph i{width:96px;height:72px;border-radius:6px;background:hsl(var(--muted));border:1px solid hsl(var(--border))}
.aph{display:flex;gap:6px;margin-top:8px;align-items:center}
.aph i{width:56px;height:42px;border-radius:4px;background:hsl(var(--muted));border:1px solid hsl(var(--border))}
.aph .more{font-size:12px;color:hsl(var(--muted-foreground))}
/* bill attachments */
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid hsl(var(--border));border-radius:999px;font-size:12px;font-weight:500;background:hsl(var(--muted)/.5);cursor:pointer;white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip em{font-style:normal;color:hsl(var(--muted-foreground));font-weight:400}
.chip:hover{border-color:hsl(var(--ring))}
.bfiles{margin-top:14px;padding:10px 12px;border:1px solid hsl(var(--border));border-radius:8px}
.bfiles .ih{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin-bottom:6px}
/* bill dialog */
.bsum{margin-top:14px;display:flex;flex-direction:column}
.brow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid hsl(var(--border));font-size:13.5px}
.brow.b{font-weight:700}.brow.big{font-size:15px;border-bottom:0;padding-top:10px}
.brow .num{font-variant-numeric:tabular-nums}
.internal{margin-top:14px;padding:10px 12px;border:1px dashed hsl(var(--border-strong));border-radius:8px;background:hsl(var(--muted)/.4)}
.internal .ih{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin-bottom:4px}
.internal .brow:last-child{border-bottom:0}
/* projects (home dashboard) */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{padding:22px 24px;cursor:pointer;display:flex;flex-direction:column;gap:16px;transition:border-color .15s}
.pcard:hover{border-color:hsl(var(--foreground))}
.pctop{display:flex;align-items:flex-start;gap:12px}
.pctop h3{font-size:16px}
.pctop .badge{margin-left:auto;flex:none}
.pcbars{display:flex;flex-direction:column;gap:11px}
.pcbar-h{display:flex;justify-content:space-between;font-size:12px;color:hsl(var(--muted-foreground));margin-bottom:5px}
.pcbar-h b{color:hsl(var(--foreground));font-weight:600}
.empty{padding:40px;text-align:center;color:hsl(var(--muted-foreground));font-size:13.5px}
.toast{position:fixed;bottom:20px;right:20px;background:hsl(var(--foreground));color:hsl(var(--background));box-shadow:0 8px 30px -10px rgba(0,0,0,.4);padding:12px 16px;border-radius:8px;font-size:13.5px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:none}
select.role{height:32px;border:1px solid hsl(var(--input));border-radius:7px;background:hsl(var(--background));padding:0 8px;font-size:13px}
.actions{display:flex;gap:6px}
@media (max-width:900px){.crumb span,.crumb span+b{display:none}.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.user{display:none}.content{padding:16px}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">A</div><div><div class="t">Apex Projects</div><div class="s">app.beapex.in</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="user"><div class="avatar" id="uAv"></div><div><div class="t" id="uName"></div><div class="s" id="uRole"></div></div></div>
  </aside>
  <div class="main">
    <div class="header"><div class="crumb" id="crumb"></div><div class="sp"></div>
      <select class="role" id="roleSel" onchange="setRole(this.value)"><option value="admin">Admin</option><option value="site">Site Supervisor</option><option value="client">Client</option></select>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="overlay" id="ov" onclick="if(event.target===this)closeDialog()"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>
const L=100000, CR=10000000;
const data={
  projects:[
    { id:'bhel', name:'BHEL Nagnar Club House', client:'T V Rao Housing Pvt Ltd', location:'Ghanpur, Hyderabad', start:'2026-08-24', status:'Active',

          packages:[

            {id:'p6',name:'Pool plumbing',alloc:410000,int:222100},
            {id:'p7',name:'Water treatment',alloc:118000,int:59220},
            {id:'p8',name:'Pool electricals and lighting',alloc:440000,int:248220},
            {id:'p9',name:'Pool accessories',alloc:277000,int:156831},
            {id:'p10',name:'Testing, commissioning and handover',alloc:60000,int:33883}],
          tasks:[
            {t:'Surface prep and repairs',owner:'Suresh K',w:1,d:2,p:100,pkg:'p1'},

function gantt(m,p){
  const weeks=14; const start=p.start?new Date(p.start):null; const nowWk=start?Math.floor((TODAY-start)/(7*864e5))+1:0;
  if(!m.tasks.length) return `<div class="empty">No tasks yet. <a href="#" onclick="dAddTask('${m.id}');return false">Add a task</a></div>`;
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const wkDate=i=>{ const d=new Date(start); d.setDate(d.getDate()+(i-1)*7); return d; };
  let months='';
  if(start){ let i=1; while(i<=weeks){ const d=wkDate(i); let n=0; while(i+n<=weeks && wkDate(i+n).getMonth()===d.getMonth()) n++; months+=`<div class="mh" style="grid-column:span ${n}">${MON[d.getMonth()]} ${d.getFullYear()}</div>`; i+=n; } }
  const lbl=i=>{ if(!start) return 'W'+i; const d=wkDate(i); return `<span class="wd">${d.getDate()}</span><span class="wn">W${i}</span>`; };
  let h=`<div class="gantt"><div class="g" style="grid-template-columns:280px repeat(${weeks},minmax(52px,1fr))">${start?`<div class="mh first"></div>${months}`:''}<div class="h th">Task</div>${Array.from({length:weeks},(_,i)=>`<div class="h ${i+1===nowWk?'now':''}">${lbl(i+1)}</div>`).join('')}`;
  const closed=state.grpClosed||(state.grpClosed=new Set());
  const groups=[...m.packages.map(k=>({id:k.id,name:k.name,tasks:phTasks(m,k)})).filter(g=>g.tasks.length),{id:'other',name:'General',tasks:m.tasks.filter(t=>!t.grp&&!m.packages.some(k=>k.id===t.pkg))}].filter(g=>g.tasks.length);
  groups.forEach(g=>{
    const key=m.id+':'+g.id; const isClosed=closed.has(key); const gd=g.tasks.reduce((a,t)=>a+t.d,0); const gp=gd?Math.round(g.tasks.reduce((a,t)=>a+t.p*t.d,0)/gd):0;
    h+=`<div class="grp gclick" onclick="toggleGrp('${key}')"><span class="gchev ${isClosed?'':'open'}">${ic('m9 18 6-6-6-6')}</span>${g.name}<span class="muted" style="font-weight:400;margin-left:8px">${g.tasks.length} tasks · ${gp}%</span></div>${Array.from({length:weeks},()=>'<div class="gcell"></div>').join('')}`;
    if(isClosed) return;
  g.tasks.forEach(t=>{ const idx=m.tasks.indexOf(t);
    const late=start&&t.p<100&&t.w+t.d-1<nowWk;
    h+=`<div class="task"><div class="t">${t.t}</div><div class="m">${t.owner} · ${t.d} wk · <b style="color:hsl(var(--foreground));font-weight:600">${t.p}%</b>${late?' · <b class="flagmini">late</b>':''}</div></div>`;
    for(let i=1;i<=weeks;i++) h+=`<div class="cell ${i===nowWk?'now':''}">${i===t.w?`<div class="bar ${late?'late':''}" style="left:3px;width:calc(${t.d*100}% - 6px)" onclick="dTask(${idx},'${m.id}')" title="${t.t}: ${t.p}%"><div class="p" style="width:${t.p}%"></div></div>`:''}</div>`;
  }); });
  return h+'</div></div>';
}

/* billing */
const GST=18, RET=5, MAS=75;
const bills=()=>data.bills.filter(b=>b.proj===state.proj);
const factor=(m,pkgId)=>{ const k=m.packages.find(x=>x.id===pkgId); return k&&k.int? k.alloc/k.int : (m.internal? m.allocated/m.internal:1); };
const phTasks=(m,k)=>m.tasks.filter(t=>!t.grp&&t.pkg===k.id);
const phStatus=(m,k)=>{ if(k.billedIn){ const b=data.bills.find(x=>x.id===k.billedIn); return b&&b.status==='Paid'?'Paid':'Billed'; } if(k.done) return 'Billable'; const ts=phTasks(m,k); return ts.length&&ts.every(t=>t.p===100)?'Billable':'Pending'; };
const phBadge=s=>({Pending:'<span class="badge secondary">In progress</span>',Billable:'<span class="badge outline">● Billable</span>',Billed:'<span class="badge outline">→ Billed</span>',Paid:'<span class="badge default">✓ Paid</span>'})[s];
function billableItems(){
  const p=proj(); const items=[];
  data.requests.filter(r=>r.proj===p.id&&r.status==='Delivered'&&!r.billedIn&&amt(r)>0).forEach(r=>{ const m=p.modules.find(x=>x.id===r.mod); const client=Math.round(amt(r)*factor(m,r.pkg));
    items.push({key:'r:'+r.id,type:'material',mod:m.id,pkg:r.pkg,desc:`${r.id} ${r.item}, ${r.qty} ${r.unit}`,cost:amt(r),client,pct:MAS}); });
  p.modules.forEach(m=>m.packages.forEach(k=>{ if(phStatus(m,k)==='Billable') items.push({key:'m:'+m.id+':'+k.id,type:'milestone',mod:m.id,pkg:k.id,desc:`${k.name} complete`,cost:k.int||0,client:k.alloc,pct:100}); }));
  return items;
}
const lineVal=l=>Math.round(l.client*l.pct/100);
const lineCost=l=>Math.round(l.cost*l.pct/100);
function billTotals(b){
  const gross=b.lines.reduce((a,l)=>a+lineVal(l),0); const taxable=gross-(b.recovery||0); const ret=Math.round(taxable*RET/100); const gst=Math.round(taxable*GST/100);
  const cost=b.lines.reduce((a,l)=>a+lineCost(l),0)-Math.round((b.recovery||0)*0.6);
  return {gross,taxable,ret,gst,net:taxable-ret+gst,cost,margin:taxable-cost};
}
const billFiles=b=>(b.files||[]).length?`<div class="att">${b.files.map(f=>`<span class="chip" onclick="toast('Opening ${f.n}')">${ic(I.bill)}${f.n}<em>${f.s}</em></span>`).join('')}</div>`:'';

const billBadge=s=>({Draft:'<span class="badge secondary">Draft</span>',Submitted:'<span class="badge outline">● Submitted</span>',Certified:'<span class="badge outline">✓ Certified</span>',Paid:'<span class="badge default">✓ Paid</span>'})[s];
function milestoneTable(m){
  const ks=m.packages;
  return `<div class="card">${ks.length?`<div class="tw"><table><thead><tr><th>Phase</th><th>Tasks</th><th class="num">Bill Amount</th><th>Status</th><th></th></tr></thead><tbody>
  ${ks.map(k=>{const st=phStatus(m,k); const ts=phTasks(m,k); const done=ts.filter(t=>t.p===100).length; const b=k.billedIn?data.bills.find(x=>x.id===k.billedIn):null;
    return `<tr><td class="name">${k.name}</td><td class="muted text-sm">${ts.length?`${done} of ${ts.length} done`:'No tasks linked'}</td><td class="num">${fmt(k.alloc)}</td><td>${phBadge(st)}${b?`<span class="sub muted text-xs">${b.id}</span>`:''}</td><td style="text-align:right">${st==='Pending'&&!ts.length&&money()?`<button class="btn sm" onclick="markPhaseDone('${m.id}','${k.id}')">Mark Complete</button>`:''}</td></tr>`;}).join('')}
  <tr class="total"><td>Total</td><td></td><td class="num">${fmt(ks.reduce((a,k)=>a+k.alloc,0))}</td><td></td><td></td></tr></tbody></table></div>`:`<div class="empty">No phases yet.</div>`}</div>
  <div class="card" style="margin-top:16px"><div class="ch"><h3>Material at Site</h3></div><div class="tw"><table><thead><tr><th>Material</th><th class="num">Cost</th><th class="num">Client Value</th><th class="num">Billable (${MAS}%)</th><th>Status</th></tr></thead><tbody>
  ${data.requests.filter(r=>r.proj===state.proj&&r.mod===m.id&&r.status==='Delivered'&&amt(r)>0).map(r=>{const cv=Math.round(amt(r)*factor(m,r.pkg)); const b=r.billedIn?data.bills.find(x=>x.id===r.billedIn):null; return `<tr><td class="name">${r.item}<span class="sub">${r.id} · ${r.qty} ${r.unit}</span></td><td class="num">${fmt(amt(r))}</td><td class="num">${fmt(cv)}</td><td class="num">${fmt(Math.round(cv*MAS/100))}</td><td>${b?`<span class="badge ${b.status==='Paid'?'default':'outline'}">${b.id} · ${b.status}</span>`:'<span class="badge outline">● Billable</span>'}</td></tr>`;}).join('')||'<tr><td colspan="5"><div class="empty">Nothing delivered yet.</div></td></tr>'}</tbody></table></div></div>`;
}
function markPhaseDone(mid,kid){ const k=proj().modules.find(x=>x.id===mid).packages.find(x=>x.id===kid); k.done=true; render(); toast(k.name+' marked complete, now billable'); }
function vBilling(el,p){
  if(isClient()) return vBillsClient(el,p);
  const bs=bills(); const items=billableItems(); const sel=state.billSel||(state.billSel=new Set(items.map(i=>i.key)));
  const sum=(f)=>bs.filter(f).reduce((a,b)=>a+billTotals(b).net,0);
  const billed=sum(b=>b.status!=='Draft'), received=sum(b=>b.status==='Paid'), outstanding=sum(b=>['Submitted','Certified'].includes(b.status));
  const selItems=items.filter(i=>sel.has(i.key)); const selVal=selItems.reduce((a,i)=>a+lineVal(i),0); const selCost=selItems.reduce((a,i)=>a+lineCost(i),0);
  const billableNow=items.reduce((a,i)=>a+lineVal(i),0);
  el.innerHTML=`<div class="pagehead"><div><h1>Billing</h1><p>RA bills to ${p.client}. All values at client price, ex GST unless shown.</p></div></div>
  <div class="card statbar">
    <div class="stat"><div class="l">Billed to Date</div><div class="v">${fmtS(billed)}</div><div class="s">${bs.filter(b=>b.status!=='Draft').length} bills, incl. GST</div></div>
    <div class="stat"><div class="l">Received</div><div class="v">${fmtS(received)}</div><div class="s">${bs.filter(b=>b.status==='Paid').length} paid</div></div>
    <div class="stat"><div class="l">Outstanding</div><div class="v">${fmtS(outstanding)}</div><div class="s">Submitted or certified, not paid</div></div>
    <div class="stat"><div class="l">Billable Now</div><div class="v">${fmtS(billableNow)}</div><div class="s">${items.length} items ready</div></div>
  </div>
  <div class="card" style="margin-bottom:20px"><div class="ch"><h3>Billable Now</h3><div class="acts"><span class="muted text-sm" style="align-self:center">${selItems.length} selected · ${fmt(selVal)} · margin ${fmt(selVal-selCost)}</span><button class="btn primary sm" ${selItems.length?'':'disabled style="opacity:.5"'} onclick="createBill()">${ic(I.plus)}Create Bill</button></div></div>
  <div class="tw"><table><thead><tr><th style="width:36px"></th><th>Item</th><th>Package</th><th>Type</th><th class="num">Client Value</th><th class="num">Billable</th><th class="num">Margin</th></tr></thead><tbody>
  ${items.map(i=>{const m=p.modules.find(x=>x.id===i.mod); return `<tr><td><input type="checkbox" ${sel.has(i.key)?'checked':''} onchange="toggleSel('${i.key}')"></td><td class="name">${i.desc}</td><td class="muted">${mno(m)} ${m.name}</td><td>${i.type==='material'?`<span class="badge outline">Material at site · ${MAS}%</span>`:'<span class="badge outline">Milestone</span>'}</td><td class="num">${fmt(i.client)}</td><td class="num">${fmt(lineVal(i))}</td><td class="num muted">${fmt(lineVal(i)-lineCost(i))}</td></tr>`;}).join('')||'<tr><td colspan="7"><div class="empty">Nothing billable yet. Items appear here when materials are delivered or milestones complete.</div></td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="ch"><h3>Bills</h3></div><div class="tw"><table><thead><tr><th>Bill</th><th>Date</th><th>Packages</th><th class="num">Taxable</th><th class="num">Net Payable</th><th class="num">Margin</th><th>Status</th><th></th></tr></thead><tbody>
  ${bs.map(b=>{const t=billTotals(b); const pk=[...new Set(b.lines.map(l=>l.mod))].map(id=>mno(p.modules.find(x=>x.id===id))).join(', ');
    const act= b.status==='Draft'?`<button class="btn sm primary" onclick="setBill('${b.id}','Submitted')">Submit</button>`: b.status==='Submitted'?`<button class="btn sm" onclick="setBill('${b.id}','Certified')">Mark Certified</button>`: b.status==='Certified'?`<button class="btn sm" onclick="setBill('${b.id}','Paid')">Mark Paid</button>`:'';
    return `<tr><td class="name">${b.id}<span class="sub">${b.paid?'Paid '+dmy(b.paid):b.certified?'Certified '+dmy(b.certified):b.submitted?'Submitted '+dmy(b.submitted):'Draft'}</span>${billFiles(b)}</td><td>${dmy(b.date)}</td><td class="muted">${pk}</td><td class="num">${fmt(t.taxable)}</td><td class="num">${fmt(t.net)}</td><td class="num muted">${fmt(t.margin)} <span class="text-xs">(${pct(t.margin,t.taxable)}%)</span></td><td>${billBadge(b.status)}</td><td><div class="actions"><button class="btn sm ghost" onclick="dBill('${b.id}')">View</button><button class="btn sm ghost" onclick="dBillUpload('${b.id}')">Upload</button>${act}</div></td></tr>`;}).join('')||'<tr><td colspan="8"><div class="empty">No bills yet.</div></td></tr>'}</tbody></table></div></div>`;
}

function toggleSel(k){ const s=state.billSel; s.has(k)?s.delete(k):s.add(k); render(); }
function createBill(){
  const p=proj(); const items=billableItems().filter(i=>state.billSel.has(i.key)); if(!items.length) return;
  const id='RA-'+String(data.bills.length+1).padStart(3,'0');
  // recover material-at-site already billed for phases completed in this bill
  let recovery=0; const phs=new Set(items.filter(i=>i.type==='milestone').map(i=>i.mod+':'+i.pkg));
  data.bills.filter(b=>b.proj===p.id).forEach(b=>b.lines.forEach(l=>{ if(l.type==='material'&&phs.has(l.mod+':'+l.pkg)&&!l.recovered){ recovery+=lineVal(l); l.recovered=true; } }));
  const lines=items.map(i=>({type:i.type,mod:i.mod,pkg:i.pkg,desc:i.desc,cost:i.cost,client:i.client,pct:i.pct}));
  data.bills.push({id,proj:p.id,date:'2026-09-07',status:'Draft',lines,recovery});
  items.forEach(i=>{ if(i.type==='material') data.requests.find(r=>'r:'+r.id===i.key).billedIn=id; else { const m=p.modules.find(x=>x.id===i.mod); m.packages.find(x=>x.id===i.pkg).billedIn=id; } });
  state.billSel=null; render(); toast(id+' created as draft'); dBill(id);
}
function setBill(id,s){ const b=data.bills.find(x=>x.id===id); b.status=s; const d='2026-09-07'; if(s==='Submitted') b.submitted=d; if(s==='Certified') b.certified=d; if(s==='Paid') b.paid=d; render(); toast(`${id} ${s.toLowerCase()}`); }
function dBill(id){
  const p=proj(); const b=data.bills.find(x=>x.id===id); const t=billTotals(b);
  const row=(l,v,cls='')=>`<div class="brow ${cls}"><span>${l}</span><span class="num">${v}</span></div>`;
  openDialog(`Bill ${b.id}`,`${p.client} · ${dmy(b.date)} · ${billBadge(b.status)}`,`
  <div class="tw" style="border:1px solid hsl(var(--border));border-radius:8px"><table style="min-width:0"><thead><tr><th>Description</th><th class="num">Client Value</th><th class="num">%</th><th class="num">Amount</th></tr></thead><tbody>
  ${b.lines.map(l=>`<tr><td>${l.desc}<span class="sub">${mno(p.modules.find(x=>x.id===l.mod))} ${p.modules.find(x=>x.id===l.mod).name}${l.type==='material'?' · material at site':''}</span></td><td class="num">${fmt(l.client)}</td><td class="num">${l.pct}%</td><td class="num">${fmt(lineVal(l))}</td></tr>`).join('')}</tbody></table></div>
  <div class="bsum">
    ${row('Gross',fmt(t.gross))}
    ${b.recovery?row('Less material at site previously billed','-'+fmt(b.recovery).slice(1)):''}
    ${row('Taxable value',fmt(t.taxable),'b')}
    ${row(`Less retention ${RET}%`,'-'+fmt(t.ret).slice(1))}
    ${row(`GST ${GST}%`,fmt(t.gst))}
    ${row('Net payable',fmt(t.net),'b big')}
  </div>
  <div class="bfiles"><div class="ih">Bill copy</div>${(b.files||[]).length?billFiles(b):'<span class="muted text-sm">No file uploaded yet.</span>'}${isClient()?'':`<button class="btn sm ghost" style="margin-top:8px" onclick="closeDialog();dBillUpload('${b.id}')">Upload file</button>`}</div>
  ${money()?`<div class="internal"><div class="ih">Internal · not on the client copy</div>${row('Cost in this bill',fmt(t.cost))}${row('Margin in this bill',`${fmt(t.margin)} <span class="muted text-xs">(${pct(t.margin,t.taxable)}%)</span>`,'b')}</div>`:''}`,
  isClient()?'Download PDF':'Download Excel',()=>{ toast(isClient()?'PDF downloaded':'Excel generated in ApexStudios format'); });
  document.querySelector('#dialog .df .btn:not(.primary)').textContent='Close';
}

const F=(l,inner,hint='')=>`<div class="field"><label>${l}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
function openDialog(title,desc,body,okLabel,onOk){
  document.getElementById('dialog').innerHTML=`<div class="dh"><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div><div class="db">${body}</div><div class="df"><button class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary" id="dOk">${okLabel}</button></div>`;
  document.getElementById('dOk').onclick=onOk; document.getElementById('ov').classList.add('open'); const f=document.querySelector('#dialog input,#dialog select'); if(f) f.focus();
}
function closeDialog(){ document.getElementById('ov').classList.remove('open'); }

function dAddTask(mid){
  const m=proj().modules.find(x=>x.id===mid);
  openDialog('Add Task',m.name,`<div class="form">
  <div class="full">${F('Task','<input id="a" placeholder="Coping stone fixing">')}</div>
  <div class="full">${F('Phase',`<select id="b">${m.packages.map(k=>`<option value="${k.id}">${k.name}</option>`).join('')}<option value="">None</option></select>`)}</div>
  ${F('Owner','<input id="c" placeholder="Gang, vendor or client">')}${F('Start Week','<input id="d" type="number" value="6" min="1" max="14">')}
  ${F('Duration (weeks)','<input id="e" type="number" value="2" min="1">')}</div>`,'Add',()=>{
    m.tasks.push({t:val('a')||'New task',owner:val('c')||'To assign',w:+val('d')||1,d:+val('e')||1,p:0,pkg:val('b')}); closeDialog(); if(state.view==='module') state.tab='schedule'; render(); toast('Task added'); });
}
function dTask(i,mid){
  const m=proj().modules.find(x=>x.id===mid); const t=m.tasks[i]; if(isClient()){ toast(`${t.t}: ${t.p}% complete`); return; }
  openDialog(t.t,t.owner,`<div class="form">
  <div class="full">${F('Progress',`<input id="a" type="range" min="0" max="100" step="10" value="${t.p}" oninput="document.getElementById('pv').textContent=this.value+'%'">`,`<span id="pv">${t.p}%</span>`)}</div>
  ${F('Start Week',`<input id="b" type="number" value="${t.w}">`)}${F('Duration (weeks)',`<input id="c" type="number" value="${t.d}">`)}
  <div class="full">${F('Note','<textarea placeholder="Optional"></textarea>')}</div></div>`,'Save',()=>{ t.p=+val('a'); t.w=+val('b')||t.w; t.d=+val('c')||t.d; closeDialog(); render(); toast('Saved'); });
}
function dNewRequest(mid){
  const p=proj(); mid=mid||(state.view==='module'?state.mod:p.modules[0].id);
  openDialog('New Stock Request','',`<div class="form">
  ${F('Package',`<select id="a" onchange="pkgOpts()">${p.modules.map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${mno(m)} ${m.name}</option>`).join('')}</select>`)}${F('Phase','<select id="b"></select>')}
  <div class="full">${F('Material','<input id="c" placeholder="Pool-grade vitrified tile 300x300" list="items"><datalist id="items"><option>Pool-grade vitrified tile 300x300, anti-skid</option><option>Dr. Fixit Pidifin 2K, 20 kg kit</option><option>Ultratech 53 grade cement, 50 kg</option><option>uPVC pipe 63 mm SCH 80, 3 m</option><option>Tile adhesive, pool grade, 20 kg</option><option>Epoxy grout, 5 kg</option></datalist>')}</div>
  ${F('Quantity','<div class="row2"><input id="d" type="number" placeholder="0"><select id="e" style="flex:0 0 90px"><option>sft</option><option>nos</option><option>bag</option><option>kit</option><option>len</option><option>kg</option><option>rft</option></select></div>')}${F('Needed By','<input id="f" type="date" value="2026-09-15">')}
  ${money()?F('Rate (₹ per unit)','<input id="g" type="number" placeholder="Optional">'):'<input type="hidden" id="g">'}
  <div class="full">${F('Note','<textarea id="h" placeholder="Optional"></textarea>')}</div></div>`,'Submit',()=>{
    const n=data.requests.length+15; data.requests.unshift({id:'SR-0'+n,proj:p.id,mod:val('a'),pkg:val('b'),item:val('c')||'Item',qty:+val('d')||0,unit:val('e'),rate:+val('g')||0,by:data.team.find(t=>t.r===state.role).n.split(' ')[0],need:val('f'),status:'Pending',raised:'2026-09-07'});
    closeDialog(); state.filter='All'; go('stock'); toast('Request submitted'); });
  pkgOpts();
}
function pkgOpts(){ const m=proj().modules.find(x=>x.id===val('a')); document.getElementById('b').innerHTML=m.packages.length?m.packages.map(k=>`<option value="${k.id}">${k.name}</option>`).join(''):'<option value="">None</option>'; }
function dInvite(){
  openDialog('Invite User','',`<div class="form"><div class="full">${F('Name','<input id="a">')}</div><div class="full">${F('Email or Phone','<input id="b">')}</div><div class="full">${F('Role','<select id="c"><option value="site">Site Supervisor</option><option value="admin">Admin</option><option value="client">Client</option></select>')}</div></div>`,'Send Invite',()=>{
    const s=document.getElementById('c'); data.team.push({n:val('a')||'New user',r:s.value,t:s.options[s.selectedIndex].text,e:val('b')}); closeDialog(); render(); toast('Invite sent'); });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDialog(); });
render();
</script>
