# pnpm settings live here from pnpm 10 onward, not in package.json.
#
# allowBuilds is an allowlist of packages permitted to run install scripts.
# An unreviewed postinstall is arbitrary code execution on every developer
# machine and every CI runner, so each entry needs a reason.
allowBuilds:
  # native resolver for eslint-plugin-import-x, pulled in by eslint-config-next
  unrs-resolver: true
  # downloads its platform binary; required by drizzle-kit and vitest
  esbuild: true
  # downloads the sentry-cli binary used for source-map upload at build
  "@sentry/cli": true
  # native libvips bindings; used only inside lib/jobs/handlers for thumbnails
  sharp: true
